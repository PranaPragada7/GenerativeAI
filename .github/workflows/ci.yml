name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Check formatting
        run: python -m black --check .

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q .

      - name: Test
        run: python -m pytest -q

  runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch and runtime dependencies
        run: |
          python -m pip install 'torch>=2.13.0,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check real provider imports and pipeline registration
        env:
          HF_HUB_OFFLINE: "1"
        run: python runtime_check.py
