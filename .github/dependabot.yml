version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # Transformers 5 removed the BART summarization pipeline used by this project.
    # Remove this range only after migrating the example and runtime check.
    ignore:
      - dependency-name: transformers
        versions: [">=5"]
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
